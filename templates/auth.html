<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>{% block title %}{% endblock title %} - SmartTrack Attendance Portal</title>

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Vendor CSS Files -->
  <link href="/static/assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/assets/vendor/font-awesome/css/font-awesome.min.css" rel="stylesheet">

  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-gradient: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      --accent: #06b6d4;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 20% 20%, #1e1b4b 0%, #0f172a 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
      margin: 0;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient glowing orbs */
    body::before {
      content: '';
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(79, 70, 229, 0.25) 0%, rgba(0,0,0,0) 70%);
      top: -150px;
      left: -150px;
      border-radius: 50%;
      pointer-events: none;
    }

    body::after {
      content: '';
      position: absolute;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.2) 0%, rgba(0,0,0,0) 70%);
      bottom: -150px;
      right: -150px;
      border-radius: 50%;
      pointer-events: none;
    }

    .auth-container {
      width: 100%;
      max-width: 460px;
      z-index: 10;
    }

    .auth-brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-icon-box {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: var(--primary-gradient);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 26px;
      box-shadow: 0 10px 25px rgba(79, 70, 229, 0.4);
      margin-bottom: 14px;
    }

    .auth-brand h3 {
      color: #ffffff;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
      font-size: 24px;
    }

    .auth-brand p {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 0;
    }

    .auth-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 36px 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
    }

    .form-group label {
      color: #cbd5e1;
      font-weight: 600;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .form-control {
      background: rgba(15, 23, 42, 0.6) !important;
      border: 1px solid rgba(255, 255, 255, 0.12) !important;
      color: #ffffff !important;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 14px;
      transition: all 0.2s ease;
    }

    .form-control:focus {
      background: rgba(15, 23, 42, 0.8) !important;
      border-color: #6366f1 !important;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.25) !important;
      color: #ffffff !important;
    }

    .form-control::placeholder {
      color: #64748b;
    }

    .btn-gradient-auth {
      background: var(--primary-gradient);
      color: #ffffff;
      border: none;
      font-weight: 700;
      font-size: 15px;
      border-radius: 12px;
      padding: 13px;
      box-shadow: 0 6px 18px rgba(79, 70, 229, 0.35);
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .btn-gradient-auth:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(79, 70, 229, 0.45);
      color: #ffffff;
    }

    .demo-pill {
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 10px;
      padding: 10px 14px;
      color: #c7d2fe;
      font-size: 12px;
      margin-top: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .auth-footer {
      text-align: center;
      margin-top: 24px;
      color: #64748b;
      font-size: 12px;
      z-index: 10;
    }
  </style>

  {% block style %}{% endblock style %}
</head>

<body>

  <div class="auth-container">
    <div class="auth-brand">
      <div class="brand-icon-box">
        <i class="fa fa-graduation-cap"></i>
      </div>
      <h3>SmartTrack</h3>
      <p>Student Attendance & Academic Management</p>
    </div>

    <div class="auth-card">
      {% block content %}{% endblock content %}
    </div>

    <div class="auth-footer">
      Student Attendance & Course Management System &bull; Secure Portal
    </div>
  </div>

  <!-- Vendor JS -->
  <script src="/static/assets/vendor/jquery/jquery.min.js"></script>
  <script src="/static/assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
